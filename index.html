<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070912"><title>SHADOW ARENA</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070d;color:#edf4ff;font-family:Inter,system-ui,Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100%;height:100%}.screen{position:absolute;inset:0;z-index:30}.hidden{display:none!important}.center{display:flex;align-items:center;justify-content:center}.panel{width:min(520px,calc(100% - 30px));text-align:center;padding:30px;border:1px solid #354b70;background:linear-gradient(145deg,#11182bcc,#050816ee);border-radius:22px;box-shadow:0 24px 90px #000}.logo{font-size:clamp(44px,10vw,86px);letter-spacing:.10em;font-weight:950;text-shadow:0 0 24px #6be5ff;font-family:Impact,sans-serif}.logo span{color:#71daf1}.tag{letter-spacing:.38em;color:#91a6c6;font-size:12px;margin:12px}.button{border:1px solid #70d9ed;border-radius:10px;background:linear-gradient(135deg,#23859b,#184b74);color:white;padding:14px 28px;font-weight:900;letter-spacing:.08em;cursor:pointer}.button:active{transform:scale(.96)}.menu-actions{display:flex;justify-content:center;gap:10px;margin-top:22px}#hud{position:absolute;inset:0;z-index:8;pointer-events:none}.topbar{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;justify-content:center}.mission{font-size:12px;letter-spacing:.12em;color:#b9d5e7;background:#07101dc9;border:1px solid #2c4d67;border-radius:9px;padding:7px 12px}.score{position:absolute;left:16px;top:52px}.score b{font-size:26px}.timer{position:absolute;right:16px;top:52px;text-align:right}.timer b{font-size:24px}.health{position:absolute;left:16px;bottom:92px;width:min(260px,38vw)}.bar{height:12px;background:#10151e;border:1px solid #526176;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#66d7ff,#c8edff);box-shadow:0 0 14px #67cdf0}.health label,.ammo label{display:block;font-size:10px;letter-spacing:.16em;margin-bottom:5px}.ammo{position:absolute;right:16px;bottom:92px;text-align:right}.ammo b{font-size:32px}.weapon{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:#bcd0e4;border:1px solid #31465e;border-radius:20px;padding:7px 13px;background:#080d16cc}.crosshair{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);border:1px solid #d9f8ff88;border-radius:50%;box-shadow:0 0 8px #55d2ea}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#bcefff}.crosshair:before{width:38px;height:1px;left:-6px;top:13px}.crosshair:after{height:38px;width:1px;left:13px;top:-6px}.damage{position:absolute;inset:0;border:0 solid #ff244f;transition:border-width .08s}.controls{position:absolute;inset:0;z-index:12;pointer-events:none}.stick,.action{pointer-events:auto}.stick{position:absolute;width:130px;height:130px;left:18px;bottom:24px;border-radius:50%;border:1px solid #76bcd655;background:#1b314733}.stick i{position:absolute;width:58px;height:58px;border-radius:50%;left:36px;top:36px;background:#b6d6e699;border:2px solid #d8f7ff88;box-shadow:0 8px 20px #000}.action{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:900;color:white;border:1px solid #8acdde;background:#1a3145aa;box-shadow:0 8px 24px #0008}.shoot{right:22px;bottom:38px;width:82px;height:82px;font-size:16px;background:#87313cab;border-color:#ff8798}.jump{right:112px;bottom:128px;width:58px;height:58px}.reload{right:116px;bottom:38px;width:58px;height:58px}.weaponbtn{right:22px;bottom:128px;width:58px;height:58px}.pause{position:absolute;right:16px;top:14px;z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid #66849d;background:#09111eea;color:white;font-size:18px;pointer-events:auto}.bossbar{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:min(430px,70vw);display:none;text-align:center}.bossbar .bar i{background:linear-gradient(90deg,#d94d79,#ff9b67)}#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);font-weight:900;letter-spacing:.14em;opacity:0;transition:.25s;text-shadow:0 0 15px #62d8ef}@media(pointer:coarse){.crosshair{opacity:.55}.health{bottom:105px}.ammo{bottom:105px}}@media(min-width:900px){.stick{left:28px;bottom:28px}.shoot{right:32px;bottom:44px}.jump{right:125px;bottom:138px}.reload{right:128px;bottom:44px}.weaponbtn{right:32px;bottom:138px}}
</style></head><body>
<div id="game"></div>
<section id="start" class="screen center"><div class="panel"><div class="logo">SHADOW <span>ARENA</span></div><div class="tag">OPERATION DEADLIGHT</div><p>Survive the machine uprising.</p><div class="menu-actions"><button id="play" class="button">DEPLOY</button></div></div></section>
<section id="pause" class="screen center hidden"><div class="panel"><h1>PAUSED</h1><div class="menu-actions"><button id="resume" class="button">RESUME</button><button id="pauseRestart" class="button">RESTART</button></div></div></section>
<section id="gameover" class="screen center hidden"><div class="panel"><h1>MISSION FAILED</h1><p id="finalScore"></p><div class="menu-actions"><button id="restart" class="button">REDEPLOY</button></div></div></section>
<div id="hud" class="hidden"><div class="topbar"><div id="mission" class="mission">MISSION 1 · HOLD THE ARENA</div></div><button id="pauseBtn" class="pause">Ⅱ</button><div class="score">SCORE<br><b id="score">0</b></div><div class="timer">SURVIVAL<br><b id="time">00:00</b></div><div id="bossbar" class="bossbar">WAR MACHINE<br><div class="bar"><i id="bosshealth"></i></div></div><div class="health"><label>ARMOR</label><div class="bar"><i id="health"></i></div></div><div class="ammo"><label id="weaponName">RIFLE</label><b id="ammo">30</b> / <span id="reserve">120</span></div><div id="weapon" class="weapon">1 · VX-RIFLE</div><div class="crosshair"></div><div id="damage" class="damage"></div><div id="toast"></div></div>
<div id="touch" class="controls hidden"><div id="stick" class="stick"><i id="knob"></i></div><div id="shoot" class="action shoot">FIRE</div><div id="jump" class="action jump">▲</div><div id="reload" class="action reload">R</div><div id="switch" class="action weaponbtn">⇄</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id), game=$('game');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x060915); scene.fog=new THREE.FogExp2(0x060915,.012);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500); const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;game.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x83baff,0x101426,1.7));const sun=new THREE.DirectionalLight(0xc9efff,3.2);sun.position.set(-35,55,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);

function mat(c,m=.3,r=.2){return new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r})}
const ground=new THREE.Mesh(new THREE.CircleGeometry(64,64),mat(0x111827,.35,.7));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(128,32,0x277e9a,0x1b3b4c);grid.position.y=.012;scene.add(grid);
for(let i=0;i<26;i++){const a=i/26*Math.PI*2,r=38+Math.random()*20;const h=2+Math.random()*7;const b=new THREE.Mesh(new THREE.BoxGeometry(3+Math.random()*5,h,3+Math.random()*5),mat(i%3?0x242f40:0x18394a,.5,.45));b.position.set(Math.cos(a)*r, h/2,Math.sin(a)*r);b.rotation.y=Math.random()*Math.PI;b.castShadow=b.receiveShadow=true;scene.add(b)}
for(let i=0;i<12;i++){const ring=new THREE.Mesh(new THREE.RingGeometry(1.5,1.65,.32),new THREE.MeshBasicMaterial({color:0x4bd5e9,side:THREE.DoubleSide,transparent:true,opacity:.55}));ring.rotation.x=-Math.PI/2;ring.position.set((i%4-1.5)*18, .025,(Math.floor(i/4)-1)*18);scene.add(ring)}

const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.15,6,10),mat(0x182636,.65,.25));body.position.y=1.42;body.castShadow=true;player.add(body);
const chest=new THREE.Mesh(new THREE.BoxGeometry(.78,.72,.38),mat(0x263d55,.75,.22));chest.position.set(0,1.55,.18);player.add(chest);
for(const x of [-.52,.52]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.75,4,8),mat(0x1b2b3a,.7,.25));arm.position.set(x,1.35,.06);arm.rotation.z=x*.12;player.add(arm)}
for(const x of [-.25,.25]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.8,4,8),mat(0x101827,.7,.25));leg.position.set(x,.55,.02);player.add(leg)}
const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),mat(0x202b3b,.5,.3));head.position.y=2.28;player.add(head);const visor=new THREE.Mesh(new THREE.BoxGeometry(.52,.10,.12),new THREE.MeshBasicMaterial({color:0x75eaff}));visor.position.set(0,2.31,.29);player.add(visor);
const gun=new THREE.Group();gun.position.set(.55,1.62,.45);const barrel=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.95),mat(0x465a6d,.8,.18));barrel.position.z=.25;gun.add(barrel);player.add(gun);player.position.set(0,0,14);

const keys={},state={running:false,paused:false,health:100,score:0,time:0,weapon:0,shooting:false,vy:0,grounded:true,ammo:[30,12],reserve:[120,36],enemySpawn:1};
const weapons=[{name:'VX-RIFLE',mag:30,reserve:120,damage:34,rate:.11,spread:.018},{name:'ION-SHOTGUN',mag:12,reserve:36,damage:18,rate:.55,spread:.09}];
let enemies=[],shots=[],yaw=0,pitch=-.35,lastShot=0,clock=THREE.Clock?null:null;

function enemyMesh(boss=false){const g=new THREE.Group();const s=boss?1.8:1;const core=new THREE.Mesh(new THREE.CapsuleGeometry(.43*s,1.05*s,6,10),mat(boss?0x7a1f45:0x3a243d,.55,.28));core.position.y=1.15*s;core.castShadow=true;g.add(core);const eye=new THREE.Mesh(new THREE.BoxGeometry(.62*s,.13*s,.12),new THREE.MeshBasicMaterial({color:boss?0xff704a:0xff405f}));eye.position.set(0,1.65*s,.43*s);g.add(eye);for(const x of [-.55,.55]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13*s,.72*s,4,8),mat(0x20172a,.7,.25));arm.position.set(x*s,1.25*s,.05);g.add(arm)}g.userData={hp:boss?600:100,speed:boss?2.2:1.8+(Math.random()*1),boss,radius:boss?1.4:.7,flash:0};return g}
function spawnEnemy(boss=false){const e=enemyMesh(boss),a=Math.random()*Math.PI*2,r=boss?34:28+Math.random()*20;e.position.set(Math.cos(a)*r,0,Math.sin(a)*r);scene.add(e);enemies.push(e);if(boss){$('bossbar').style.display='block';$('mission').textContent='MISSION 2 · DESTROY THE WAR MACHINE'}}

function rayShoot(){if(state.paused||!state.running)return;const w=state.weapon,now=performance.now()/1000;if(now-lastShot<weapons[w].rate)return;if(state.ammo[w]<=0){toast('EMPTY · PRESS R');return}lastShot=now;state.ammo[w]--;const pellets=w===1?7:1;for(let p=0;p<pellets;p++){const dir=new THREE.Vector3((Math.random()-.5)*weapons[w].spread,(Math.random()-.5)*weapons[w].spread,-1).applyEuler(camera.rotation).normalize();const origin=gun.getWorldPosition(new THREE.Vector3()).add(dir.clone().multiplyScalar(.8));const hit=new THREE.Raycaster(origin,dir,0,80);const targets=[];enemies.forEach(e=>e.traverse(o=>{if(o.isMesh)targets.push(o)}));const result=hit.intersectObjects(targets,false)[0];const shot=new THREE.Mesh(new THREE.SphereGeometry(.035,6,6),new THREE.MeshBasicMaterial({color:0x8befff}));shot.position.copy(origin);shot.userData={dir:dir,life:.45};scene.add(shot);shots.push(shot);if(result){let e=enemies.find(x=>{let yes=false;x.traverse(o=>{if(o===result.object)yes=true});return yes});if(e){e.userData.hp-=weapons[w].damage;e.userData.flash=.09;burst(result.point,0xff5577);if(e.userData.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);state.score+=e.userData.boss?1000:100;if(e.userData.boss){$('bossbar').style.display='none';$('mission').textContent='ARENA SECURED · HOLD POSITION'}}}}}}
function burst(pos,c){for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.05,4,4),new THREE.MeshBasicMaterial({color:c}));s.position.copy(pos);s.userData={dir:new THREE.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5),life:.45};scene.add(s);shots.push(s)}}
function toast(text){$('toast').textContent=text;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,900)}

let move={x:0,y:0},firing=false,stickId=null,lookId=null,lastTouch={x:0,y:0};
function stickMove(e){e.preventMessage;const t=[...e.touches].find(x=>x.identifier===stickId);if(!t)return;const r=$('stick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=t.clientX-cx,y=t.clientY-cy;const d=Math.hypot(x,y),m=Math.min(d,46);if(d)move={x:x/d*m/46,y:y/d*m/46};else move={x:0,y:0};$('knob').style.transform=`translate(${move.x*46}px,${move.y*46}px)`}
$('stick').addEventListener('touchstart',e=>{e.preventDefault();stickId=e.changedTouches[0].identifier}, {passive:false});
renderer.domElement.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX>innerWidth*.28){lookId=t.identifier;lastTouch={x:t.clientX,y:t.clientY}}}}, {passive:true});
window.addEventListener('touchmove',e=>{for(const t of e.touches){if(t.identifier===stickId)stickMove(e);if(t.identifier===lookId){yaw-= (t.clientX-lastTouch.x)*.004;pitch-= (t.clientY-lastTouch.y)*.003;pitch=Math.max(-1.15,Math.min(.55,pitch));lastTouch={x:t.clientX,y:t.clientY}}}}, {passive:false});
window.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(t.identifier===stickId){stickId=null;move={x:0,y:0};$('knob').style.transform='';}if(t.identifier===lookId)lookId=null}}, {passive:true});
$('shoot').addEventListener('touchstart',e=>{e.preventDefault();firing=true},{passive:false});$('shoot').addEventListener('touchend',()=>firing=false);
$('jump').addEventListener('touchstart',e=>{e.preventDefault();if(state.grounded){state.vy=7.5;state.grounded=false}} ,{passive:false});
$('reload').addEventListener('touchstart',e=>{e.preventDefault();reload()},{passive:false});$('switch').addEventListener('touchstart',e=>{e.preventDefault();switchWeapon()},{passive:false});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'&&state.grounded){state.vy=7.5;state.grounded=false}if(e.code==='KeyR')reload();if(e.code==='Digit1')switchWeapon(0);if(e.code==='Digit2')switchWeapon(1)});window.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('mousedown',()=>firing=true);window.addEventListener('mouseup',()=>firing=false);renderer.domElement.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch-=e.movementY*.0025;pitch=Math.max(-1.15,Math.min(.55,pitch))}});renderer.domElement.addEventListener('click',()=>{if(state.running&&!matchMedia('(pointer:coarse)').matches)renderer.domElement.requestPointerLock?.()});

function reload(){const w=state.weapon,n=Math.min(weapons[w].mag-state.ammo[w],state.reserve[w]);if(n>0){state.reserve[w]-=n;state.ammo[w]+=n;toast('WEAPON RELOADED')}}
function switchWeapon(n){state.weapon=n??(state.weapon+1)%weapons.length;$('weaponName').textContent=weapons[state.weapon].name;$('weapon').textContent=(state.weapon+1)+' · '+weapons[state.weapon].name;toast(weapons[state.weapon].name)}

function reset(){for(const e of enemies)scene.remove(e);for(const s of shots)scene.remove(s);enemies=[];shots=[];player.position.set(0,0,14);yaw=0;pitch=-.35;state.health=100;state.score=0;state.time=0;state.weapon=0;state.running=true;state.paused=false;state.ammo=[30,12];state.reserve=[120,36];switchWeapon(0);$('bossbar').style.display='none';$('gameover').classList.add('hidden');$('pause').classList.add('hidden');$('start').classList.add('hidden');$('hud').classList.remove('hidden');$('touch').classList.remove('hidden');if(matchMedia('(pointer:coarse)').matches==false)$('touch').style.opacity='.35'}
$('play').onclick=reset;$('restart').onclick=reset;$('pauseRestart').onclick=reset;$('resume').onclick=()=>{state.paused=false;$('pause').classList.add('hidden')};$('pauseBtn').onclick=()=>{if(state.running){state.paused=!state.paused;$('pause').classList.toggle('hidden',!state.paused)}};

let last=performance.now(),spawnT=0;
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.035);last=now;if(!state.running||state.paused){renderer.render(scene,camera);return}state.time+=dt;spawnT-=dt;if(spawnT<=0&&enemies.length<12){spawnEnemy(false);spawnT=Math.max(.7,2.2-state.time*.012)}if(state.time>45&&!enemies.some(e=>e.userData.boss)&&!enemies.filter(e=>e.userData.boss).length&&state.time<46){spawnEnemy(true)}
let forward=(keys.KeyW?1:0)-(keys.KeyS?1:0)-move.y,side=(keys.KeyD?1:0)-(keys.KeyA?1:0)+move.x;if(forward||side){const len=Math.hypot(forward,side)||1;forward/=len;side/=len;const speed=(keys.ShiftLeft||keys.ShiftRight?9:5.5)*dt;const dx=(side*Math.cos(yaw)+forward*Math.sin(yaw))*speed,dz=(-side*Math.sin(yaw)+forward*Math.cos(yaw))*speed;player.position.x+=dx;player.position.z+=dz;const r=player.position.length();if(r>58){player.position.x*=58/r;player.position.z*=58/r}player.rotation.y=Math.atan2(dx,dz)+yaw}
state.vy-=18*dt;player.position.y+=state.vy*dt;if(player.position.y<=0){player.position.y=0;state.vy=0;state.grounded=true}
for(const e of enemies){const to=player.position.clone().sub(e.position);to.y=0;if(to.length()>e.userData.radius){to.normalize();e.position.add(to.multiplyScalar(e.userData.speed*dt)}e.lookAt(player.position.x,e.position.y,player.position.z);if(e.userData.flash>0)e.userData.flash-=dt;if(to.length()<e.userData.radius+.6&&Math.random()<dt*1.8){state.health-=e.userData.boss?9:5;$('damage').style.borderWidth='18px';setTimeout(()=>$('damage').style.borderWidth='0',80);if(state.health<=0){state.running=false;$('finalScore').textContent=`Score ${state.score} · Survived ${format(state.time)}`;$('hud').classList.add('hidden');$('touch').classList.add('hidden');$('gameover').classList.remove('hidden')}}}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.position.addScaledVector(s.userData.dir,dt*5);s.userData.life-=dt;if(s.userData.life<=0){scene.remove(s);shots.splice(i,1)}}
if(firing||keys.Mouse0)rayShoot();
const camTarget=new THREE.Vector3(player.position.x,player.position.y+1.65,player.position.z);const cos=Math.cos(yaw),sin=Math.sin(yaw),dist=7.2;camera.position.set(camTarget.x-sin*dist*Math.cos(pitch),camTarget.y+dist*Math.sin(pitch)+2.6,camTarget.z-cos*dist*Math.cos(pitch));camera.lookAt(camTarget);gun.rotation.y=-yaw*.08;
$('score').textContent=state.score;$('time').textContent=format(state.time);$('health').style.width=Math.max(0,state.health)+'%';$('ammo').textContent=state.ammo[state.weapon];$('reserve').textContent=state.reserve[state.weapon];const boss=enemies.find(e=>e.userData.boss);if(boss){$('bosshealth').style.width=Math.max(0,boss.userData.hp/600*100)+'%'}renderer.render(scene,camera)}
function format(t){const m=Math.floor(t/60),s=Math.floor(t%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
requestAnimationFrame(animate);
</script></body></html>
