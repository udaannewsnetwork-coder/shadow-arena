<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070912"><title>SHADOW ARENA</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#05070d;color:#edf4ff;font-family:Inter,system-ui,Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}canvas{display:block;width:100%;height:100%}.screen{position:absolute;inset:0;z-index:20}.hidden{display:none!important}.center{display:flex;align-items:center;justify-content:center}.panel{width:min(520px,calc(100%-30px));text-align:center;padding:30px;border:1px solid #354b70;background:linear-gradient(145deg,#11182bcc,#050816ee);border-radius:22px;box-shadow:0 24px 90px #000}.logo{font-size:clamp(44px,10vw,86px);letter-spacing:.12em;font-weight:950;text-shadow:0 0 24px #6be5ff;font-family:Impact,sans-serif}.logo span{color:#71daf1}.tag{letter-spacing:.38em;color:#91a6c6;font-size:12px;margin:12px}.button{border:1px solid #70d9ed;border-radius:10px;background:linear-gradient(135deg,#23859b,#184b74);color:white;padding:14px 28px;font-weight:900;letter-spacing:.08em;cursor:pointer}.button:active{transform:scale(.96)}.menu-actions{display:flex;justify-content:center;gap:10px;margin-top:22px}#hud{position:absolute;inset:0;z-index:8;pointer-events:none}.topbar{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;justify-content:center}.mission{font-size:12px;letter-spacing:.12em;color:#b9d5e7;background:#07101dc9;border:1px solid #2c4d67;border-radius:9px;padding:7px 12px}.score{position:absolute;left:16px;top:52px}.score b{font-size:26px}.timer{position:absolute;right:16px;top:52px;text-align:right}.timer b{font-size:24px}.health{position:absolute;left:16px;bottom:92px;width:min(260px,38vw)}.bar{height:12px;background:#10151e;border:1px solid #526176;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#66d7ff,#c8edff);box-shadow:0 0 14px #67cdf0}.health label,.ammo label{display:block;font-size:10px;letter-spacing:.16em;margin-bottom:5px}.ammo{position:absolute;right:16px;bottom:92px;text-align:right}.ammo b{font-size:32px}.weapon{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:#bcd0e4;border:1px solid #31465e;border-radius:20px;padding:7px 13px;background:#080d16cc}.crosshair{position:absolute;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);border:1px solid #d9f8ff88;border-radius:50%;box-shadow:0 0 8px #55d2ea}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#bcefff}.crosshair:before{width:38px;height:1px;left:-6px;top:13px}.crosshair:after{height:38px;width:1px;left:13px;top:-6px}.damage{position:absolute;inset:0;border:0 solid #ff244f;transition:border-width .08s}.controls{position:absolute;inset:0;z-index:12;pointer-events:none}.stick,.action{pointer-events:auto}.stick{position:absolute;width:130px;height:130px;left:18px;bottom:24px;border-radius:50%;border:1px solid #76bcd655;background:#1b314733}.stick i{position:absolute;width:58px;height:58px;border-radius:50%;left:36px;top:36px;background:#b6d6e699;border:2px solid #d8f7ff88;box-shadow:0 8px 20px #000}.action{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:900;color:white;border:1px solid #8acdde;border-right-color:#5a89a7;background:#1a3145aa;box-shadow:0 8px 24px #0008}.shoot{right:22px;bottom:38px;width:82px;height:82px;font-size:16px;background:#87313cab;border-color:#ff8798}.jump{right:112px;bottom:128px;width:58px;height:58px}.reload{right:116px;bottom:38px;width:58px;height:58px}.weaponbtn{right:22px;bottom:128px;width:58px;height:58px}.pause{position:absolute;right:16px;top:14px;z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid #66849d;background:#09111eea;color:white;font-size:18px;pointer-events:auto}.bossbar{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:min(430px,70vw);display:none;text-align:center}.bossbar .bar i{background:linear-gradient(90deg,#d94d79,#ff9b67)}#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);font-weight:900;letter-spacing:.14em;opacity:0;transition:.25s;text-shadow:0 0 15px #62d8ef}@media(pointer:coarse){.crosshair{opacity:.55}.health{bottom:105px}.ammo{bottom:105px}}@media(min-width:900px){.stick{left:28px;bottom:28px}.shoot{right:32px;bottom:44px}.jump{right:125px;bottom:138px}.reload{right:128px;bottom:44px}.weaponbtn{right:32px;bottom:138px}}
</style></head><body>
<div id="game"></div>
<section id="start" class="screen center"><div class="panel"><div class="logo">SHADOW <span>ARENA</span></div><div class="tag">OPERATION DEADLIGHT</div><p>Survive the machine uprising.</p><div class="menu-actions"><button id="play" class="button">DEPLOY</button></div></div></section>
<section id="pause" class="screen center hidden"><div class="panel"><h1>PAUSED</h1><div class="menu-actions"><button id="resume" class="button">RESUME</button><button id="pauseRestart" class="button">RESTART</button></div></div></section>
<section id="gameover" class="screen center hidden"><div class="panel"><h1>MISSION FAILED</h1><p id="finalScore"></p><div class="menu-actions"><button id="restart" class="button">REDEPLOY</button></div></div></section>
<div id="hud" class="hidden"><div class="topbar"><div id="mission" class="mission">MISSION 1 · HOLD THE ARENA</div></div><button id="pauseBtn" class="pause">Ⅱ</button><div class="score">SCORE<br><b id="score">0</b></div><div class="timer">SURVIVAL<br><b id="time">00:00</b></div><div id="bossbar" class="bossbar">WAR MACHINE<br><div class="bar"><i id="bosshealth"></i></div></div><div class="health"><label>ARMOR</label><div class="bar"><i id="health"></i></div></div><div class="ammo"><label id="weaponName">RIFLE</label><b id="ammo">30</b> / <span id="reserve">120</span></div><div id="weapon" class="weapon">1 · VX-RIFLE</div><div class="crosshair"></div><div id="damage" class="damage"></div><div id="toast"></div></div>
<div id="touch" class="controls hidden"><div id="stick" class="stick"><i id="knob"></i></div><div id="shoot" class="action shoot">FIRE</div><div id="jump" class="action jump">▲</div><div id="reload" class="action reload">R</div><div id="switch" class="action weaponbtn">⇄</div></div>
